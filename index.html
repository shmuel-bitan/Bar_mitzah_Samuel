<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9e1d5">
  <meta name="description" content="Invitation à la Bar-Mitsva de Samuel Choukroun">
  <title>Invitation · Bar-Mitsva de Samuel</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="glow glow-one"></span>
    <span class="glow glow-two"></span>
    <span class="glow glow-three"></span>
    <span class="grain"></span>
  </div>

  <main class="experience" id="experience">
    <header class="hero-copy" id="heroCopy">
      <p class="overline">Invitation personnelle</p>
      <h1>La Bar-Mitsva de Samuel</h1>
      <p class="hero-note">Vanessa et Maurice ont la joie de vous inviter</p>
    </header>

    <section class="envelope-area" aria-label="Invitation fermée">
      <div class="envelope-shadow" aria-hidden="true"></div>

      <div class="envelope-shell" id="envelopeShell">
        <div class="envelope-back" aria-hidden="true">
          <div class="liner-pattern"></div>
        </div>

        <figure class="card-slip card-flight" aria-hidden="true">
          <div class="art-crop">
            <img src="assets/carte-samuel.jpg" alt="">
          </div>
        </figure>

        <div class="front-sheet" aria-hidden="true"></div>

        <div class="flap" aria-hidden="true">
          <div class="flap-face flap-front"></div>
          <div class="flap-face flap-back">
            <span class="flap-ornament"></span>
          </div>
        </div>

        <div class="side-fold side-fold-left" aria-hidden="true"></div>
        <div class="side-fold side-fold-right" aria-hidden="true"></div>
        <div class="front-pocket" aria-hidden="true"></div>

        <div class="recipient" aria-hidden="true">
          <span>Pour</span>
          <strong id="guestName">notre famille et nos amis</strong>
        </div>

        <button class="open-trigger" id="openButton" type="button" aria-label="Ouvrir l’invitation">
          <span class="wax-seal" aria-hidden="true">
            <span class="wax-ring"></span>
            <span class="wax-letter">S</span>
          </span>
        </button>
      </div>

      <div class="open-guidance" id="openGuidance" aria-hidden="true">
        <span class="guidance-line"></span>
        <span>Touchez le sceau pour ouvrir</span>
        <span class="guidance-line"></span>
      </div>

      <div class="particles" id="particles" aria-hidden="true"></div>
    </section>

    <section class="invitation-view" id="invitationView" aria-hidden="true">
      <div class="view-glow" aria-hidden="true"></div>

      <div class="invitation-panel">
        <p class="revealed-label">Vous êtes invité</p>

        <figure class="invitation-card">
          <div class="card-edge" aria-hidden="true"></div>
          <div class="art-crop">
            <img src="assets/carte-samuel.jpg" alt="Invitation à la Bar-Mitsva de Samuel, jeudi 24 septembre à 9 heures au Centre Européen du Judaïsme à Paris">
          </div>
        </figure>

        <div class="event-summary" aria-label="Résumé de l’événement">
          <span>Jeudi 24 septembre</span>
          <i aria-hidden="true"></i>
          <span>9h00</span>
          <i aria-hidden="true"></i>
          <span>Paris 17e</span>
        </div>

        <div class="actions">
          <a class="primary-action" id="rsvpButton" href="https://bm-samuel-lilac.vercel.app/">
            <span>Répondre à l’invitation</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M14 7l5 5-5 5"/></svg>
          </a>
          <button class="replay-action" id="replayButton" type="button">Rejouer l’ouverture</button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js?v=7"></script>
</body>
</html>
